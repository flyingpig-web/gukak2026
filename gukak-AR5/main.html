<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>아리랑 — 무엇을 해볼까?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" type="text/css" media="screen" href="css/import.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/preload-manifest.js"></script>
    <script src="js/common.js"></script>
  </head>
  <body>
    <main>
      <div class="wrap">
        <div class="container">
          <!-- 배경: 길목 + 도람 얼굴(bg_main.png) -->
          <div class="scene-bg" style="background-image: url(img/02_main/bg_main.png)"></div>

          <!-- 말풍선 — 문구가 구워진 소스 3종(text_main / text_exp1 / text_exp2)을 교체 -->
          <img class="main-text" id="mainText" src="img/02_main/text_main.png" alt="아리랑이 각 지역의 풍경을 만나 어떻게 발전됐을까?" />

          <!-- 선택① 표지판과 길목 → 활동1 (hover 시 on 이미지) -->
          <img class="choice-img img-exp1" src="img/02_main/btn_exp1.png" alt="" />
          <img class="choice-img choice-on img-exp1-on" src="img/02_main/btn_exp1_on.png" alt="" />
          <button class="choice-hit hit-exp1" id="hitExp1" aria-label="활동1 지역에 따라 아리랑이 달라져요"></button>

          <!-- 선택② 대보름 공터와 달집 → 활동2 (미납품 — 이동 없음) -->
          <img class="choice-img img-exp2" src="img/02_main/btn_exp2.png" alt="" />
          <img class="choice-img choice-on img-exp2-on" src="img/02_main/btn_exp2_on.png" alt="" />
          <button class="choice-hit hit-exp2" id="hitExp2" aria-label="활동2 각 지역의 아리랑에 다양한 풍경이 담겨있어요"></button>

          <button class="btn-top btn-home main-home" id="btnHome">
            <img src="img/00_common/btn_home.png" alt="홈" />
          </button>
        </div>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
