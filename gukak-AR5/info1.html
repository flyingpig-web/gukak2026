<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>활동1 정보 — 더 알아보기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" type="text/css" media="screen" href="css/import.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/preload-manifest.js"></script>
    <script src="js/common.js"></script>
  </head>
  <body data-info="1" class="info1">
    <main>
      <div class="wrap">
        <div class="container">
          <!-- 배경에 찬돌이 구워져 있다 -->
          <div class="scene-bg" style="background-image: url(img/05_info1/bg_info.png)"></div>

          <button class="btn-top btn-back" id="btnBack">
            <img src="img/00_common/btn_back.png" alt="뒤로가기" />
          </button>
          <img class="top-title title-info" src="img/05_info1/title_info.png" alt="더 알아보기" />
          <button class="btn-top btn-home" id="btnHome">
            <img src="img/00_common/btn_home.png" alt="홈" />
          </button>

          <!-- 책 3권은 info.js 가 생성(좌우 화살표로 회전, 가운데 책을 누르면 팝업) -->
          <div class="books" id="books"></div>
          <button class="book-nav book-prev" id="btnPrev"><img src="img/05_info1/btn_left.png" alt="이전 책" /></button>
          <button class="book-nav book-next" id="btnNext"><img src="img/05_info1/btn_right.png" alt="다음 책" /></button>

          <img class="info-bubble" src="img/05_info1/speech_bubble.png" alt="궁금한 기록을 눌러 하나씩 살펴보자" />

          <!-- 책 정보 팝업 — 화면 아무 곳이나 누르면 닫힌다(기획 p41-4) -->
          <div class="dimmed book-dim" id="bookDim">
            <!-- 팝업과 [X] 를 한 덩어리로 띄운다 -->
            <div class="book-card">
              <img class="book-pop" id="bookPop" src="" alt="" />
              <button class="book-close" id="bookClose"><img id="bookCloseImg" src="" alt="닫기" /></button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="js/info.js"></script>
  </body>
</html>
